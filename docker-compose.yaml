# Local Backstage for testing the Phoenix templates: http://localhost:7007
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "backstage"]
      interval: 5s
      retries: 20

  backstage:
    build: .
    ports:
      - "${BACKSTAGE_PORT:-7007}:7007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Entra settings (see .env.example); optional until Entra is enabled.
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage
      # Local-only credentials for the account registry client talking to Floci.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      FLOCI_ENDPOINT: ${FLOCI_ENDPOINT:-http://host.docker.internal:4566}
    volumes:
      - ./phoenix:/app/phoenix:ro
      - ./app-config.docker.yaml:/app/app-config.docker.yaml:ro
      - ./app-config.entra.yaml:/app/app-config.entra.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
