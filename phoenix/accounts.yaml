# OFFLINE / LOCAL-DEV FIXTURE ONLY.
# The live catalog is served by the aws-accounts entity provider
# (plugins/catalog-backend-module-aws-accounts), which reads the DynamoDB
# account registry and projects the SAME aws-account Resource shape. Keep this
# file so Backstage still runs with no AWS (Docker/local); it is not the source
# of truth. One Resource per group account, named <group>-aws-account.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: research-aws-account
  description: AWS account of the research group
  annotations:
    phoenix/organisation: acme
    phoenix/account-id: "111111111111"
    phoenix/state-bucket: acme-tfstate-111111111111
    phoenix/state-region: eu-west-1
    phoenix/management-account-id: "444444444444"
    phoenix/base-domain: example.com
    # The group's GitOps repository; every cluster's Argo CD bootstraps from it.
    phoenix/apps-repo: "git@github.com:acme/phoenix-apps.git"
spec:
  type: aws-account
  owner: group:default/research
