# Curated models. Adding one is adding an entity here. The source pre-fills
# the workload form; version is the Hugging Face commit SHA (a branch moves).
# size-gib is the repo's full size plus ~10%: the copy job's scratch volume.
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: model-llama-3-1-8b
  title: Llama 3.1 8B Instruct
  description: "Meta Llama 3.1 8B Instruct (gated: needs a Hugging Face token)."
  annotations:
    phoenix/source-type: "huggingface"
    phoenix/source-uri: "meta-llama/Llama-3.1-8B-Instruct"
    phoenix/version: "0e9e39f249a16976918f6564b8830bc894c89659"
    phoenix/size-gib: "34"
    phoenix/credentials: "true"
    phoenix/min-gpu: "l4"
spec:
  type: phoenix-model
  owner: group:default/platform
  dependsOn:
    - resource:default/component-aws-fsx-csi-driver
    - resource:default/component-model-weights
    - resource:default/component-vllm
